services:
  postgres:
    image: postgres:16-alpine
    container_name: gubee-stock-postgres
    environment:
      POSTGRES_DB: stock_reconciliation
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock_reconciliation"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: gubee-stock-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stock_reconciliation
      SPRING_DATASOURCE_USERNAME: stock
      SPRING_DATASOURCE_PASSWORD: stock
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres_data:
